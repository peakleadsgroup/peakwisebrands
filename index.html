<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Wise Brands</title>
  <meta name="description" content="Simple products. Better brands. Built with intention.">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0a;
      --paper: #f7f6f4;
      --paper-deep: #ebe8e3;
      --muted: #4a4a4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #ffffff 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 90%, var(--paper-deep) 0%, transparent 50%),
        var(--paper);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .blob {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      background: var(--ink);
    }

    .blob-tr {
      top: -8%;
      right: -6%;
      width: min(38vw, 320px);
      height: min(34vw, 280px);
      border-radius: 42% 58% 60% 40% / 48% 38% 62% 52%;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .blob-bl {
      bottom: -10%;
      left: -8%;
      width: min(42vw, 360px);
      height: min(36vw, 300px);
      border-radius: 58% 42% 45% 55% / 40% 55% 45% 60%;
      animation: drift 18s ease-in-out infinite alternate-reverse;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(520px, 100%);
      text-align: center;
    }

    .logo {
      width: min(200px, 48vw);
      height: auto;
      margin: 0 auto 40px;
      opacity: 0;
      animation: rise 0.9s ease forwards;
    }

    h1 {
      font-size: clamp(1.45rem, 4.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 16px;
      opacity: 0;
      animation: rise 0.9s ease 0.12s forwards;
    }

    .lede {
      font-size: clamp(1rem, 2.8vw, 1.1rem);
      font-weight: 400;
      color: var(--muted);
      line-height: 1.55;
      max-width: 34ch;
      margin: 0 auto 36px;
      opacity: 0;
      animation: rise 0.9s ease 0.24s forwards;
    }

    .pillars {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 0;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      animation: rise 0.9s ease 0.36s forwards;
    }

    .pillars span:not(:last-child)::after {
      content: "|";
      margin: 0 0.85em;
      color: #b0aea8;
      font-weight: 400;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes drift {
      from { transform: translate(0, 0) rotate(0deg); }
      to { transform: translate(-12px, 10px) rotate(3deg); }
    }

    @media (max-width: 480px) {
      .blob-tr { width: 46vw; height: 40vw; }
      .blob-bl { width: 50vw; height: 42vw; }

      .pillars {
        flex-direction: column;
        gap: 10px;
        letter-spacing: 0.1em;
      }

      .pillars span:not(:last-child)::after { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, h1, .lede, .pillars {
        opacity: 1;
        animation: none;
      }

      .blob { animation: none; }
    }
  </style>
</head>
<body>
  <div class="blob blob-tr" aria-hidden="true"></div>
  <div class="blob blob-bl" aria-hidden="true"></div>

  <main>
    <img class="logo" src="images/logo.png" alt="Peak Wise" width="200" height="240">
    <h1>Simple products. Better brands. Built with intention.</h1>
    <p class="lede">Peak Wise Brands builds thoughtful everyday goods—quality products made to last.</p>
    <p class="pillars">
      <span>Thoughtful ideas</span>
      <span>Quality products</span>
      <span>Built to last</span>
    </p>
  </main>
</body>
</html>
